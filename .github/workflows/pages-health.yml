# Manual check: prints what GitHub Pages sees for the custom domain.
name: Pages health check
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== pages site"; gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          echo; echo "== dns health"; gh api "repos/${GITHUB_REPOSITORY}/pages/health" || true
